name: Daily Crawl A2A Agent Cards

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: a2a-daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Crawl and verify live A2A Agent Cards
        run: npm run crawl

      - name: Validate and build static registry
        run: |
          npm run validate:cards
          npm run build

      - name: Commit updated crawled registry
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet registry/crawled/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes in registry/crawled/."
            exit 0
          fi
          git add registry/crawled/
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore(crawl): refresh live A2A Agent Cards ($DATE)"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: crawl
    if: needs.crawl.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
